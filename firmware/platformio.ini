[platformio]
default_envs = fuji_mega_three_r2

[env]
platform = atmelavr@5.1.0
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++11 -Wall -Wextra
build_src_filter = +<main.cpp>

[env:fuji_mega_three_r2]
board = megaatmega2560
build_src_filter = +<fuji_main.cpp>
build_flags = ${env.build_flags} -DFUJI_PCB_R2=1
